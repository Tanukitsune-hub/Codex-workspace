<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bonvoyポイント宿泊 お得度チェッカー</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif; }
    body { margin: 0; background: #f4f7fb; color: #1f2937; }
    .wrap { max-width: 780px; margin: 24px auto; padding: 20px; }
    .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 1.5rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label { font-weight: 600; display: block; margin-bottom: 6px; }
    input { width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 12px; font-size: 1rem; }
    .full { grid-column: 1 / -1; }
    button { margin-top: 12px; width: 100%; border: none; border-radius: 10px; padding: 12px; font-weight: 700; font-size: 1rem; color: #fff; background: #0f766e; cursor: pointer; }
    button:hover { background: #115e59; }
    .result { margin-top: 18px; padding: 14px; border-radius: 10px; background: #f1f5f9; }
    .score { font-size: 1.1rem; font-weight: 700; }
    .good { color: #047857; }
    .ok { color: #b45309; }
    .bad { color: #b91c1c; }
    .muted { font-size: .9rem; color: #64748b; }
    @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Bonvoyポイント宿泊 お得度チェッカー</h1>
      <p class="muted">現金料金と必要ポイントから、1ポイントあたりの価値(円/pt)とお得度を計算します。</p>

      <div class="grid">
        <div>
          <label for="cashRate">現金宿泊料金（税・サービス料込み / 円）</label>
          <input id="cashRate" type="number" min="0" step="1" value="45000" />
        </div>
        <div>
          <label for="points">必要Bonvoyポイント（pt）</label>
          <input id="points" type="number" min="1" step="1" value="50000" />
        </div>
        <div>
          <label for="fees">ポイント泊でも別途かかる費用（円）</label>
          <input id="fees" type="number" min="0" step="1" value="0" />
        </div>
        <div>
          <label for="target">あなたの基準価値（円/pt）</label>
          <input id="target" type="number" min="0" step="0.001" value="0.9" />
        </div>
        <div class="full">
          <button id="calcBtn">計算する</button>
        </div>
      </div>

      <div id="result" class="result" aria-live="polite"></div>
    </div>
  </div>

  <script>
    const formatJPY = (num) => new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY', maximumFractionDigits: 0 }).format(num);

    function calculateValue() {
      const cashRate = Number(document.getElementById('cashRate').value);
      const points = Number(document.getElementById('points').value);
      const fees = Number(document.getElementById('fees').value);
      const target = Number(document.getElementById('target').value);
      const result = document.getElementById('result');

      if (!Number.isFinite(cashRate) || !Number.isFinite(points) || !Number.isFinite(fees) || !Number.isFinite(target) || points <= 0 || cashRate < 0 || fees < 0 || target < 0) {
        result.innerHTML = '<span class="bad">入力値を確認してください。</span>';
        return;
      }

      const netSavings = cashRate - fees;
      const yenPerPoint = netSavings / points;
      const valuePct = target === 0 ? 0 : (yenPerPoint / target) * 100;

      let labelClass = 'ok';
      let verdict = '標準的';
      if (yenPerPoint >= target * 1.15) {
        labelClass = 'good';
        verdict = 'かなりお得';
      } else if (yenPerPoint <= target * 0.85) {
        labelClass = 'bad';
        verdict = '割高気味';
      }

      result.innerHTML = `
        <div class="score ${labelClass}">判定: ${verdict}</div>
        <p>1ポイントあたり価値: <strong>${yenPerPoint.toFixed(3)} 円/pt</strong></p>
        <p>現金払い回避額（概算）: <strong>${formatJPY(netSavings)}</strong></p>
        <p>あなたの基準比: <strong>${valuePct.toFixed(1)}%</strong></p>
        <p class="muted">目安: 一般的に円/ptが高いほどポイント利用効率が高いと考えられます。</p>
      `;
    }

    document.getElementById('calcBtn').addEventListener('click', calculateValue);
    calculateValue();
  </script>
</body>
</html>
